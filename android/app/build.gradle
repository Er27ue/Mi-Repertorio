plugins {
    id "com.android.application"
}

android {
    namespace "com.mirepertorio.app"
    compileSdk 37

    defaultConfig {
        applicationId "com.mirepertorio.app"
        minSdk 24
        targetSdk 37
        versionCode 4
        versionName "1.3"
    }
}

tasks.register("copyWebAssets", Copy) {
    from("../../client/dist")
    into("src/main/assets/public")
}

preBuild.dependsOn("copyWebAssets")
